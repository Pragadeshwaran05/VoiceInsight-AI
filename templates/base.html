<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}VoiceInsight AI{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="topbar">

        <div class="brand">
            <div class="brand-icon">VI</div>

            <div>
                <h1>VoiceInsight AI</h1>
                <span>Text & Speech Intelligence</span>
            </div>
        </div>

        <nav>
            <a href="{{ url_for('index') }}">Dashboard</a>
        </nav>

    </header>


    <main class="main-container">

        {% block content %}
        {% endblock %}

    </main>


    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
